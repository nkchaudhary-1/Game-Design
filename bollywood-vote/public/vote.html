  <script>
    // Optional stage backdrop: if /img/backdrop.jpg (or .png / .webp) exists, the site uses it behind everything.
    (function () {
      var names = ['backdrop.jpg', 'backdrop.png', 'backdrop.webp'], i = 0;
      (function next() {
        if (i >= names.length) return;
        var src = '/img/' + names[i++], img = new Image();
        img.onload = function () { var r = document.documentElement; r.style.setProperty('--backdrop', 'url(' + src + ')'); r.classList.add('has-backdrop'); };
        img.onerror = next;
        img.src = src;
      })();
    })();
  </script>
