<style>
/* ==========================================================================================
   Design tokens — no design system exists yet, so they live here (neon-arcade palette,
   Orbitron for display, Rajdhani for UI). The canvas reads the colours from these too.
   ========================================================================================== */
:root {
  --c-void: #06050f;
  --c-bg: #0b0919;
  --c-panel: rgba(20, 16, 43, .78);
  --c-panel-solid: #14102b;
  --c-line: #342a6e;
  --c-text: #f3f0ff;
  --c-text-dim: #b3abdf;
  --c-text-faint: #7c74b2;

  --c-you: #19e3ff;        /* team: player */
  --c-cpu: #ffa63d;        /* team: CPU */
  --c-striker: #ff3b7a;
  --c-aegis: #8f7bff;
  --c-vortex: #b8ff3d;

  --c-ring: #ff5c4d;       /* cause: ring-out */
  --c-spin: #6aa8ff;       /* cause: spin-out */
  --c-win: #3dffa0;
  --c-lose: #ff4d6d;
  --c-draw: #ffd23f;

  --f-display: 'Orbitron', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  --f-ui: 'Rajdhani', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;
  --r-1: 8px; --r-2: 14px; --r-3: 20px; --r-pill: 999px;
  --t-fast: 120ms; --t-med: 260ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --glow-you: 0 0 18px rgba(25, 227, 255, .45);
  --glow-cpu: 0 0 18px rgba(255, 166, 61, .45);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body {
  height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--c-void); color: var(--c-text);
  font-family: var(--f-ui); font-weight: 600; font-size: 16px; line-height: 1.25;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--c-you); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---- Layout: one screen, grid of HUD + stage + footer ------------------------------------ */
#app {
  position: fixed; inset: 0; margin: 0 auto; width: 100%; max-width: 780px;
  display: grid; gap: var(--s-2); pointer-events: none;
  padding: max(var(--s-2), env(safe-area-inset-top)) max(var(--s-3), env(safe-area-inset-right))
           max(var(--s-2), env(safe-area-inset-bottom)) max(var(--s-3), env(safe-area-inset-left));
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "you score cpu" "stage stage stage" "foot foot foot";
}
#app > * { pointer-events: none; }
#app > button, .foot > button { pointer-events: auto; }
.foot { grid-area: foot; display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); min-width: 0; }
#stage { grid-area: stage; min-width: 0; min-height: 0; position: relative; }
@media (orientation: landscape) and (max-height: 560px) {
  #app {
    grid-template-columns: minmax(118px, 21%) minmax(0, 1fr) minmax(118px, 21%);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "you stage cpu" "score stage ." ". stage ." "back stage mute";
  }
  .hud-score { justify-self: stretch; }
}

/* ---- HUD --------------------------------------------------------------------------------- */
.hud-card {
  min-width: 0; padding: 7px 9px; border-radius: var(--r-2);
  background: var(--c-panel); border: 1px solid var(--c-line);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: grid; gap: 5px; align-content: start;
}
.hud-card.you { grid-area: you; border-left: 3px solid var(--c-you); box-shadow: var(--glow-you); }
.hud-card.cpu { grid-area: cpu; border-right: 3px solid var(--c-cpu); box-shadow: var(--glow-cpu); text-align: right; }
.hud-who { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; min-width: 0; }
.cpu .hud-who { flex-direction: row-reverse; justify-content: flex-start; }
.tag { font: 800 9px/1 var(--f-display); letter-spacing: .1em; padding: 3px 4px; border-radius: 4px; color: var(--c-void); }
.you .tag { background: var(--c-you); } .cpu .tag { background: var(--c-cpu); }
.hud-name { font: 700 11px/1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.meter { height: 8px; border-radius: var(--r-pill); background: #07051a; border: 1px solid var(--c-line); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(var(--v, 1)); background: linear-gradient(90deg, var(--c-you), #7df3ff); border-radius: inherit; }
.cpu .meter > i { transform-origin: right center; background: linear-gradient(270deg, var(--c-cpu), #ffd08a); }
.meter.low > i { background: linear-gradient(90deg, #ff3b4d, #ff9a4d); animation: lowpulse .7s ease-in-out infinite alternate; }
.cpu .meter.low > i { background: linear-gradient(270deg, #ff3b4d, #ff9a4d); }
@keyframes lowpulse { to { opacity: .45; } }
.hud-num { font: 700 11px/1 var(--f-ui); letter-spacing: .12em; color: var(--c-text-dim); text-transform: uppercase; display: flex; gap: 6px; align-items: baseline; }
.cpu .hud-num { justify-content: flex-end; }
.hud-num b { font: 800 15px/1 var(--f-display); color: var(--c-text); font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: right; }
.cpu .hud-num b { text-align: left; }
.hud-num.low b { color: #ff6b6b; }

.hud-score { grid-area: score; align-self: start; justify-self: center; padding: 6px 8px; border-radius: var(--r-2); background: var(--c-panel); border: 1px solid var(--c-line); text-align: center; min-width: 64px; }
.hud-score small { display: block; font: 700 10px/1 var(--f-ui); letter-spacing: .2em; color: var(--c-text-faint); margin-bottom: 4px; }
.hud-score .nums { font: 900 20px/1 var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.hud-score .nums span:first-child { color: var(--c-you); } .hud-score .nums span:last-child { color: var(--c-cpu); }
.hud-score .nums i { font-style: normal; color: var(--c-text-faint); margin: 0 5px; }

/* footer tools + hint */
.tool { min-width: 44px; min-height: 44px; padding: 0 var(--s-3); display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-pill); background: var(--c-panel); border: 1px solid var(--c-line); font: 700 12px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--c-text-dim); transition: transform var(--t-fast) var(--ease), border-color var(--t-fast); }
.tool:hover { border-color: var(--c-text-faint); color: var(--c-text); }
.tool:active { transform: scale(.95); }
.tool svg { width: 20px; height: 20px; flex: none; }
#btnBack { grid-area: back; justify-self: start; }
#btnMute { grid-area: mute; justify-self: end; }
.tool.mute .on { display: none; } .tool.mute[aria-pressed="true"] .on { display: block; } .tool.mute[aria-pressed="true"] .off { display: none; }
#hint { flex: 1; min-width: 0; text-wrap: balance; text-align: center; font: 700 14px/1.15 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--c-text-dim); min-height: 1.2em; transition: opacity var(--t-med); }
#hint.pulse { animation: hintpulse 1.6s ease-in-out infinite; color: var(--c-text); }
@keyframes hintpulse { 50% { opacity: .45; } }
@media (orientation: landscape) and (max-height: 560px) {
  .foot { display: contents; }
  #hint { grid-area: stage; align-self: end; justify-self: center; z-index: 3; padding-bottom: 2px; text-shadow: 0 0 8px #000; flex: none; }
}

/* in-world banner (RING OUT / SPIN OUT) */
#banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; text-align: center; white-space: nowrap; pointer-events: none; opacity: 0; font: 900 clamp(26px, 9vw, 60px)/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
#banner small { display: block; margin-top: 8px; font: 700 clamp(12px, 3.4vw, 17px)/1.1 var(--f-ui); letter-spacing: .22em; color: var(--c-text); }
#banner.show { animation: bannerpop 1.5s var(--ease) forwards; }
#banner.ring { color: var(--c-ring); text-shadow: 0 0 22px rgba(255, 92, 77, .75); }
#banner.spin { color: var(--c-spin); text-shadow: 0 0 22px rgba(106, 168, 255, .75); }
#banner.neutral { color: var(--c-draw); text-shadow: 0 0 22px rgba(255, 210, 63, .7); }
@keyframes bannerpop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(.98); } }

/* ---- Buttons ----------------------------------------------------------------------------- */
.btn { min-height: 52px; padding: 0 var(--s-5); border-radius: var(--r-2); font: 800 14px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform var(--t-fast) var(--ease), box-shadow var(--t-med), filter var(--t-fast); }
.btn:active { transform: scale(.97); }
.btn.primary { color: #07051a; background: linear-gradient(135deg, var(--c-you), #7b8bff 55%, #ff5ccf); box-shadow: 0 0 0 1px rgba(255, 255, 255, .15) inset, 0 8px 28px rgba(25, 227, 255, .28); }
.btn.primary:hover { filter: brightness(1.1); box-shadow: 0 0 0 1px rgba(255, 255, 255, .25) inset, 0 8px 34px rgba(255, 92, 207, .38); }
.btn.ghost { color: var(--c-text); background: rgba(255, 255, 255, .04); border: 1.5px solid var(--c-line); }
.btn.ghost:hover { border-color: var(--c-text-faint); background: rgba(255, 255, 255, .08); }
.btn.big { min-height: 58px; font-size: 16px; width: 100%; }

/* ---- Screens (select + result overlays) -------------------------------------------------- */
.screen { position: fixed; inset: 0; z-index: 10; display: flex; }
.screen.select { background: radial-gradient(120% 90% at 50% 0%, rgba(86, 48, 190, .45), transparent 60%), rgba(6, 5, 15, .9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow-y: auto; touch-action: pan-y; }
.select-inner { width: min(100%, 540px); margin: auto; padding: max(var(--s-4), env(safe-area-inset-top)) max(var(--s-4), env(safe-area-inset-right)) max(var(--s-4), env(safe-area-inset-bottom)) max(var(--s-4), env(safe-area-inset-left)); display: grid; gap: var(--s-3); }
.select-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); }
.logo { font: 900 clamp(26px, 8.4vw, 42px)/.95 var(--f-display); letter-spacing: .04em; text-transform: uppercase; background: linear-gradient(100deg, #fff 0%, var(--c-you) 40%, #ff5ccf 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo span { display: block; font-size: .5em; letter-spacing: .5em; margin-top: 6px; -webkit-text-fill-color: var(--c-text-dim); color: var(--c-text-dim); background: none; }
.tagline { color: var(--c-text-dim); font-size: 16px; margin-top: var(--s-1); }
.blade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.blade-tile { --accent: var(--c-striker); position: relative; display: grid; justify-items: center; gap: 2px; padding: 10px 6px 8px; border-radius: var(--r-2); background: var(--c-panel-solid); border: 1.5px solid var(--c-line); transition: transform var(--t-fast) var(--ease), border-color var(--t-fast), box-shadow var(--t-med), background var(--t-med); }
.blade-tile[data-blade="striker"] { --accent: var(--c-striker); } .blade-tile[data-blade="aegis"] { --accent: var(--c-aegis); } .blade-tile[data-blade="vortex"] { --accent: var(--c-vortex); }
.blade-tile canvas { width: 72px; height: 72px; display: block; }
.blade-tile .bt-name { font: 800 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.blade-tile .bt-role { font: 700 12px/1 var(--f-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--c-text-faint); }
.blade-tile:hover { transform: translateY(-2px); border-color: var(--c-text-faint); }
.blade-tile[aria-checked="true"] { border-color: var(--accent); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, var(--c-panel-solid)), var(--c-panel-solid)); box-shadow: 0 0 0 1px var(--accent), 0 0 26px color-mix(in srgb, var(--accent) 38%, transparent); }
.blade-tile[aria-checked="true"] .bt-role { color: var(--accent); }
.detail { padding: var(--s-3) var(--s-4); border-radius: var(--r-2); background: var(--c-panel); border: 1px solid var(--c-line); display: grid; gap: 10px; --accent: var(--c-striker); }
.detail-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
.detail h2 { font: 800 18px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.chip { font: 800 11px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; padding: 5px 8px; border-radius: var(--r-pill); border: 1px solid currentColor; white-space: nowrap; }
.detail p { color: var(--c-text-dim); font-size: 16px; line-height: 1.25; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.stats dt { font: 700 12px/1 var(--f-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--c-text-faint); }
.stats dd { height: 8px; border-radius: var(--r-pill); background: #07051a; border: 1px solid var(--c-line); overflow: hidden; }
.stats dd i { display: block; height: 100%; width: calc(var(--v, .5) * 100%); background: var(--accent); border-radius: inherit; transition: width var(--t-med) var(--ease); }
.matchups { display: flex; flex-wrap: wrap; gap: 8px; }
.mu { font: 700 13px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; padding: 7px 10px; border-radius: var(--r-1); background: rgba(255, 255, 255, .05); }
.mu b { font-weight: 800; }
.mu.win { color: var(--c-win); } .mu.lose { color: var(--c-lose); }
.fine { text-align: center; color: var(--c-text-faint); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.select .tool { flex: none; }
@media (orientation: landscape) and (max-height: 560px) {
  .select-inner { width: min(100%, 940px); grid-template-columns: 1fr 1fr; grid-template-areas: "top detail" "tiles detail" "start detail" "fine detail"; align-items: start; column-gap: var(--s-5); row-gap: 8px; }
  .select-top { grid-area: top; } .blade-grid { grid-area: tiles; } .detail { grid-area: detail; align-self: center; } #btnStart { grid-area: start; } .fine { grid-area: fine; }
  .blade-tile canvas { width: 52px; height: 52px; } .blade-tile { padding: 6px 4px; }
  .logo { font-size: 28px; } .tagline { display: none; }
}

/* result: bottom sheet (portrait) / side panel (short landscape) so the arena stays visible */
.screen.result { align-items: flex-end; justify-content: center; pointer-events: none; }
.sheet { pointer-events: auto; width: min(100%, 560px); padding: var(--s-4) max(var(--s-4), env(safe-area-inset-right)) max(var(--s-4), env(safe-area-inset-bottom)) max(var(--s-4), env(safe-area-inset-left)); border-radius: var(--r-3) var(--r-3) 0 0; background: linear-gradient(180deg, #181238, #0b091c); border: 1px solid var(--c-line); border-bottom: 0; box-shadow: 0 -18px 50px rgba(0, 0, 0, .55); display: grid; gap: 10px; animation: sheetin var(--t-med) var(--ease); }
@keyframes sheetin { from { transform: translateY(24px); opacity: 0; } }
.res-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.res-title { font: 900 clamp(26px, 8vw, 36px)/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.res-title.win { color: var(--c-win); text-shadow: 0 0 18px rgba(61, 255, 160, .45); } .res-title.lose { color: var(--c-lose); text-shadow: 0 0 18px rgba(255, 77, 109, .45); } .res-title.draw { color: var(--c-draw); text-shadow: 0 0 18px rgba(255, 210, 63, .4); }
.cause-chip { display: inline-flex; align-items: center; gap: 6px; font: 800 12px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; padding: 8px 10px; border-radius: var(--r-pill); border: 1.5px solid currentColor; white-space: nowrap; }
.cause-chip svg { width: 16px; height: 16px; }
.cause-chip.ring { color: var(--c-ring); background: rgba(255, 92, 77, .12); } .cause-chip.spin { color: var(--c-spin); background: rgba(106, 168, 255, .12); } .cause-chip.neutral { color: var(--c-draw); background: rgba(255, 210, 63, .1); }
.cause-line { font-size: 18px; font-weight: 700; line-height: 1.2; }
.why { color: var(--c-text-dim); font-size: 15px; line-height: 1.25; }
.why b { color: var(--c-text); }
.res-stats { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 18px; font-size: 14px; padding: 8px 12px; border-radius: var(--r-1); background: rgba(255, 255, 255, .04); }
.res-stats span:nth-child(3n+1) { color: var(--c-text-faint); letter-spacing: .08em; text-transform: uppercase; font-size: 12px; align-self: center; }
.res-stats span:nth-child(3n+2), .res-stats span:nth-child(3n) { text-align: right; font: 700 14px/1.2 var(--f-display); font-variant-numeric: tabular-nums; min-width: 4.5ch; }
.res-stats .h { font: 800 11px/1 var(--f-display) !important; letter-spacing: .12em; }
.res-stats .h.you { color: var(--c-you) !important; } .res-stats .h.cpu { color: var(--c-cpu) !important; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-row .btn { padding: 0 12px; font-size: 13px; letter-spacing: .08em; white-space: nowrap; }
@media (orientation: landscape) and (max-height: 560px) {
  .screen.result { align-items: stretch; justify-content: flex-end; }
  .sheet { width: min(46%, 400px); height: 100%; overflow-y: auto; align-content: center; border-radius: var(--r-3) 0 0 var(--r-3); border: 1px solid var(--c-line); border-right: 0; padding-top: 10px; padding-bottom: 10px; gap: 6px; }
  .sheet > * { min-width: 0; }
  .res-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .res-title { font-size: clamp(22px, 7.5vh, 30px); }
  .res-stats { padding: 5px 10px; gap: 2px 14px; } .cause-chip { padding: 6px 9px; font-size: 11px; }
  .cause-line { font-size: 16px; } .why { font-size: 14px; } .btn { min-height: 44px; }
}
}

/* debug overlay (?debug) */
#debug { position: fixed; left: 8px; bottom: 60px; z-index: 40; padding: 6px 8px; font: 600 11px/1.35 ui-monospace, Menlo, monospace; color: #9dffb8; background: rgba(0, 0, 0, .7); border-radius: 6px; pointer-events: none; white-space: pre; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  #banner.show { animation: none; opacity: 1; }
}
</style>
</head>
<body>
<canvas id="game" aria-hidden="true"></canvas>

<main id="app">
  <section class="hud-card you" id="hudYou" aria-label="Your blade">
    <div class="hud-who"><span class="tag">YOU</span><span class="hud-name" id="youName">Striker</span></div>
    <div class="meter" id="youMeter" aria-hidden="true"><i></i></div>
    <div class="hud-num" id="youNum"><span>Spin</span><b id="youSpin">100</b></div>
  </section>
  <div class="hud-score" aria-label="Score"><small>SCORE</small><div class="nums"><span id="scoreYou">0</span><i>:</i><span id="scoreCpu">0</span></div></div>
  <section class="hud-card cpu" id="hudCpu" aria-label="CPU blade">
    <div class="hud-who"><span class="tag">CPU</span><span class="hud-name" id="cpuName">Aegis</span></div>
    <div class="meter" id="cpuMeter" aria-hidden="true"><i></i></div>
    <div class="hud-num" id="cpuNum"><b id="cpuSpin">100</b><span>Spin</span></div>
  </section>

  <div id="stage"><div id="banner" aria-hidden="true"></div></div>

  <div class="foot">
  <button class="tool" id="btnBack" type="button" aria-label="Back to blade select">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Blades</span>
  </button>
  <div id="hint" role="status" aria-live="off"></div>
  <button class="tool mute" id="btnMute" type="button" aria-label="Mute sound effects" aria-pressed="false">
    <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
    <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
  </button>
  </div>
</main>

<!-- Blade select -->
<section class="screen select" id="screenSelect" aria-labelledby="selTitle">
  <div class="select-inner">
    <div class="select-top">
      <div>
        <h1 class="logo" id="selTitle">Spinblade<span>Arena</span></h1>
        <p class="tagline">One quick battle. Pick your blade.</p>
      </div>
      <button class="tool mute" type="button" data-mute aria-label="Mute sound effects" aria-pressed="false">
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
      </button>
    </div>
    <div class="blade-grid" id="bladeGrid" role="radiogroup" aria-label="Choose your blade"></div>
    <div class="detail" id="detail" aria-live="polite"></div>
    <button class="btn primary big" id="btnStart" type="button">Start battle</button>
    <p class="fine">Pull back &amp; release to launch · drag to steer</p>
  </div>
</section>

<!-- Result -->
<section class="screen result" id="screenResult" aria-labelledby="resTitle" hidden>
  <div class="sheet" role="dialog" aria-modal="false">
    <div class="res-head"><h2 class="res-title" id="resTitle">Victory</h2><span class="cause-chip ring" id="resChip"></span></div>
    <p class="cause-line" id="resCause"></p>
    <p class="why" id="resWhy"></p>
    <div class="res-stats" id="resStats"></div>
    <div class="btn-row">
      <button class="btn primary" id="btnRematch" type="button">Rematch</button>
      <button class="btn ghost" id="btnChange" type="button">Change blade</button>
    </div>
  </div>
</section>

<div class="sr" id="sr" role="status" aria-live="polite"></div>

<script>
// ===== SIM:START — pure simulation, no DOM. tools/balance.mjs runs this block headlessly. =====
const SIM = (() => {
  'use strict';

  // ---- Tuning knobs (world units: arena rim radius = 100) -------------------------------------
  const T = {
    // -- arena & world ------------------------------------------------------------------------
    RIM: 100,
    DT: 1 / 120,            // fixed physics step
    BOWL: 13.6,             // inward pull (u/s²), grows linearly with distance from the centre
    LIP: 64,                // extra inward pull that ramps up steeply at the wall…
    GRIP_MIN: 0.1,          // …scaled by spin: at 0 spin the wall barely holds. Spin is armour.
    SWIRL: 28,              // tangential push so blades orbit instead of grinding at the centre
    DRAG: 1.2,              // linear drag (1/s)
    // -- collisions ---------------------------------------------------------------------------
    RESTITUTION: 0.69,
    KB_EXP: 0.58,           // knockback scales with (attacker atk / defender def)^KB_EXP
    DEF_EXP: 1.85,          // spin damage divides by defender def^DEF_EXP
    SPIN_DMG: 0.058,        // spin lost per unit of closing speed (× atk / def^DEF_EXP)
    ATTACK_EDGE: 0.35,      // the blade closing faster takes less spin damage from a hit (and deals more)
    HIT_MIN: 14,            // closing speed below this is a "touch", not a hit (no spin damage)
    HIT_CAP: 17,            // max spin lost to a single hit
    CLASH_KICK: 19,         // contact kicks blades apart (u/s), scaled by their combined spin…
    CLASH_TAN: 0.27,        // …and a share of it sideways: spinning surfaces deflect, they don't just bounce
    // -- spin -----------------------------------------------------------------------------------
    MOVE_COST: 0.005,       // spin/s lost per u/s of speed (floor friction)
    STEER_COST: 0.36,       // spin/s lost at full steering — the price of agency (DL-2)
    WOBBLE_BELOW: 22,       // spin % under which a blade starts to wobble
    WOBBLE_ACCEL: 34,
    // -- launch & match -------------------------------------------------------------------------
    LAUNCH_MIN: 34,         // launch speed at 0 power
    LAUNCH_MAX: 72,         // launch speed cap — a full-power shot straight out must not self-ring-out
    SPAWN_R: 50,            // blades spawn at mid-radius
    MAX_SPEED: 230,
    TIMEOUT: 60,            // [OPEN → proposed default] after this long the higher spin wins
    SIMUL_WINDOW: 0.1,      // after a ring-out, a second KO inside this window is a double KO
    // -- CPU (one fixed difficulty for v1) ------------------------------------------------------
    AI_PERIOD: 0.14,        // CPU re-thinks this often (its reaction time)
    AI_SMOOTH: 9,
    AI_NOISE: 0.12,         // radians of steering error

    DART_EVERY: 4.5,        // …and how often (s)

  // ---- Blade archetypes ---------------------------------------------------------------------
  // Counter-triangle (DL-3): Attack > Stamina > Defense > Attack.
  const BLADES = {

               mass: 1.0, r: 13, atk: 1.5, def: 0.7, decay: 3.0, accel: 69, ai: 'chase' },

      const t0 = ac.currentTime + (o.delay || 0), dur = o.dur || 0.15;
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.f0, t0);
      if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.gain || 0.15, t0 + (o.attack || 0.004));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.03);
    }
    function hiss(o) {
      if (!ac || muted) return;
      const t0 = ac.currentTime + (o.delay || 0), dur = o.dur || 0.1;
      const src = ac.createBufferSource(); src.buffer = noise;
      const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
      f.frequency.setValueAtTime(o.f0, t0);
      if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.gain || 0.15, t0 + (o.attack || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master); src.start(t0, Math.random() * 0.2); src.stop(t0 + dur + 0.03);
    }
    return {
      get muted() { return muted; },
      unlock() { ensure(); },
      setMuted(m) {
        muted = m; store.set('muted', m ? '1' : '0');
        if (master) master.gain.setTargetAtTime(m ? 0 : LEVEL, ac.currentTime, 0.02);
        if (m) this.humStop();
      },
      suspend() { if (ac && ac.state === 'running') ac.suspend(); },
      resume() { if (ac && ac.state === 'suspended') ac.resume(); },
      ui() { if (!ensure()) return; tone({ f0: 760, f1: 1240, dur: 0.07, gain: 0.07, type: 'triangle' }); },
      launch(p) {
        if (!ensure()) return;
        hiss({ f0: 260, f1: 1100 + 2200 * p, q: 1.4, dur: 0.3, gain: 0.16 + 0.12 * p });
        tone({ type: 'sawtooth', f0: 130, f1: 240 + 260 * p, dur: 0.28, gain: 0.05 });
      },
      hit(s) {
        if (!ac) return;
        hiss({ type: 'highpass', f0: 2600, dur: 0.06, gain: 0.05 + 0.22 * s });
        const base = (330 + Math.random() * 140) * (1.25 - 0.45 * s);
        tone({ type: 'triangle', f0: base, f1: base * 0.6, dur: 0.16 + 0.12 * s, gain: 0.07 + 0.16 * s });
        tone({ type: 'square', f0: base * 1.51, f1: base * 1.2, dur: 0.09, gain: 0.025 + 0.06 * s });
        tone({ type: 'sine', f0: 110, f1: 45, dur: 0.14, gain: 0.05 + 0.3 * s });
      },
      ringOut() {
        if (!ac) return;
        tone({ type: 'sine', f0: 880, f1: 90, dur: 0.75, gain: 0.2 });
        hiss({ f0: 1800, f1: 160, q: 0.8, dur: 0.65, gain: 0.14 });
      },
      spinOut() {
        if (!ac) return;
        tone({ type: 'sawtooth', f0: 240, f1: 38, dur: 1.1, gain: 0.1 });
        tone({ type: 'sawtooth', f0: 247, f1: 41, dur: 1.1, gain: 0.08 });
      },
      win() { if (!ac) return; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.22, gain: 0.07, delay: 0.5 + i * 0.09 })); },
      lose() { if (!ac) return; [392, 311.13, 233.08].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.3, gain: 0.13, delay: 0.5 + i * 0.16 })); },
      draw() { if (!ac) return; [440, 440].forEach((f, i) => tone({ type: 'sine', f0: f, dur: 0.25, gain: 0.12, delay: 0.5 + i * 0.2 })); },
      // A low hum whose pitch tracks the average spin: you can *hear* the battle running down.
      humStart() {
        if (!ac || muted || hum) return;
        const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'sawtooth'; o.frequency.value = 180; f.type = 'lowpass'; f.frequency.value = 520; g.gain.value = 0.0001;
        o.connect(f); f.connect(g); g.connect(master); o.start();
        g.gain.exponentialRampToValueAtTime(0.028, ac.currentTime + 0.3);
        hum = { o, g };
      },
      humSet(spin01) { if (hum) hum.o.frequency.setTargetAtTime(70 + 190 * clamp(spin01, 0, 1), ac.currentTime, 0.1); },
      humStop() {
        if (!hum) return; const h = hum; hum = null;
        h.g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.12); h.o.stop(ac.currentTime + 0.6);
      },
    };
  })();

  // ==========================================================================================
  // State
  // ==========================================================================================
  const G = {
    state: 'select',            // select → ready → live → ending → result
    you: BLADES[store.get('blade')] ? store.get('blade') : 'striker',
    cpu: null, match: null, result: null,
    score: { you: 0, cpu: 0 },
    acc: 0, timeScale: 1, slowLeft: 0, freeze: 0, endAt: 0, t: 0, speed: 1,
    ko: [], reduced: mqReduce.matches, launchedEver: false, readySince: 0, hintTimer: 0,
  };
  mqReduce.addEventListener('change', (e) => { G.reduced = e.matches; });

  // ==========================================================================================
  // Canvas layout + cached layers
  // ==========================================================================================
  const view = { w: 0, h: 0, dpr: 1, cx: 0, cy: 0, scale: 1, base: 1, tcx: 0, tcy: 0, tscale: 1, bcx: 0, bcy: 0 };
  let bgC = null, arenaC = null; const sprites = {};
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

  function layout() {
    view.w = document.documentElement.clientWidth; view.h = document.documentElement.clientHeight;
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    el.canvas.width = Math.round(view.w * view.dpr); el.canvas.height = Math.round(view.h * view.dpr);
    const r = el.stage.getBoundingClientRect();
    const size = Math.max(40, Math.min(r.width, r.height));
    view.base = size / 2 / (T.RIM + 14);
    view.bcx = r.left + r.width / 2; view.bcy = r.top + r.height / 2;
    retarget(true);
    buildCaches();
  }

  // Where the arena sits: the stage normally; the free area beside/above the result sheet when it is up.
  function retarget(snap) {
    if (G.state === 'result' && !el.result.hidden) {
      const s = $('.sheet', el.result).getBoundingClientRect();
      const side = s.left > view.w * 0.45;           // short-landscape: sheet is a right-hand panel
      const hud = $('#hudYou').getBoundingClientRect();
      const x0 = side ? $('#hudYou').getBoundingClientRect().right + 8 : 0, x1 = side ? s.left - 8 : view.w;
      const y0 = side ? 8 : Math.max(hud.bottom + 6, 56), y1 = side ? view.h - 8 : s.top - 6;
      const size = Math.max(60, Math.min(x1 - x0, y1 - y0));
      view.tcx = (x0 + x1) / 2; view.tcy = (y0 + y1) / 2; view.tscale = Math.min(view.base, size / 2 / (T.RIM + 14));
    } else { view.tcx = view.bcx; view.tcy = view.bcy; view.tscale = view.base; }
    if (snap || G.reduced) { view.cx = view.tcx; view.cy = view.tcy; view.scale = view.tscale; }
  }

  function buildCaches() {
    const { w, h, dpr, base } = view;
    // background: deep gradient, faint grid, halo behind the arena
    bgC = mk(w * dpr, h * dpr);
    const b = bgC.getContext('2d'); b.setTransform(dpr, 0, 0, dpr, 0, 0);
    let g = b.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0f0b2b'); g.addColorStop(1, '#05040d');
    b.fillStyle = g; b.fillRect(0, 0, w, h);
    g = b.createRadialGradient(view.bcx, view.bcy, 0, view.bcx, view.bcy, Math.max(w, h) * 0.6);
    g.addColorStop(0, 'rgba(110,70,255,.30)'); g.addColorStop(0.55, 'rgba(60,30,160,.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.fillRect(0, 0, w, h);
    b.strokeStyle = 'rgba(130,110,255,.07)'; b.lineWidth = 1; b.beginPath();
    const step = 36; const ox = view.bcx % step, oy = view.bcy % step;
    for (let x = ox; x < w; x += step) { b.moveTo(x + 0.5, 0); b.lineTo(x + 0.5, h); }
    for (let y = oy; y < h; y += step) { b.moveTo(0, y + 0.5); b.lineTo(w, y + 0.5); }
    b.stroke();

    // arena (static layer, in world units)
    const R = T.RIM, ext = R + 24, px = 2 * ext * base * dpr;
    arenaC = mk(px, px);
    const a = arenaC.getContext('2d'); const S = base * dpr;
    a.setTransform(S, 0, 0, S, ext * S, ext * S);
    g = a.createRadialGradient(0, 0, R - 6, 0, 0, R + 24); g.addColorStop(0, 'rgba(130,90,255,.5)'); g.addColorStop(1, 'rgba(130,90,255,0)');
    a.fillStyle = g; a.beginPath(); a.arc(0, 0, R + 24, 0, TAU); a.fill();
    // wall / lip
    g = a.createLinearGradient(-R, -R, R, R); g.addColorStop(0, '#4a3bb0'); g.addColorStop(0.5, '#1c1448'); g.addColorStop(1, '#3a2b94');
    a.fillStyle = g; a.beginPath(); a.arc(0, 0, R + 9, 0, TAU); a.arc(0, 0, R - 1, 0, TAU, true); a.fill('evenodd');
    // floor: the bowl, lighter on the climb towards the wall
    g = a.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, '#120d34'); g.addColorStop(0.5, '#181242'); g.addColorStop(0.85, '#241a64'); g.addColorStop(1, '#33278c');
    a.fillStyle = g; a.beginPath(); a.arc(0, 0, R, 0, TAU); a.fill();
    // danger band on the wall slope
    g = a.createRadialGradient(0, 0, R - 16, 0, 0, R); g.addColorStop(0, 'rgba(255,92,77,0)'); g.addColorStop(1, 'rgba(255,92,77,.28)');
    a.fillStyle = g; a.beginPath(); a.arc(0, 0, R, 0, TAU); a.fill();
    // rings + spokes (reference for the swirl)
    a.strokeStyle = 'rgba(160,135,255,.16)'; a.lineWidth = 0.6;
    for (const f of [0.25, 0.5, 0.75]) { a.beginPath(); a.arc(0, 0, R * f, 0, TAU); a.stroke(); }
    a.strokeStyle = 'rgba(160,135,255,.07)'; a.beginPath();
    for (let i = 0; i < 12; i++) { const an = (i * TAU) / 12; a.moveTo(Math.cos(an) * 10, Math.sin(an) * 10); a.lineTo(Math.cos(an) * (R - 2), Math.sin(an) * (R - 2)); }
    a.stroke();
    // launch pads
    a.setLineDash([2.5, 3]); a.strokeStyle = 'rgba(160,135,255,.3)'; a.lineWidth = 0.8;
    for (const y of [T.SPAWN_R, -T.SPAWN_R]) { a.beginPath(); a.arc(0, y, 14, 0, TAU); a.stroke(); }
    a.setLineDash([]);
    // centre mark
    a.strokeStyle = 'rgba(160,135,255,.35)'; a.lineWidth = 0.9; a.beginPath(); a.arc(0, 0, 5, 0, TAU); a.stroke();
    // neon rim
    a.save(); a.shadowColor = 'rgba(160,120,255,.9)'; a.shadowBlur = 14 * S;
    a.strokeStyle = 'rgba(200,180,255,.95)'; a.lineWidth = 1.8; a.beginPath(); a.arc(0, 0, R, 0, TAU); a.stroke(); a.restore();
    a.strokeStyle = 'rgba(255,255,255,.18)'; a.lineWidth = 0.7; a.beginPath(); a.arc(0, 0, R - 2.4, 0, TAU); a.stroke();

    // blade sprites (drawn at battle scale, scaled down on the result screen)
    for (const k of KINDS) {
      const r = BLADES[k].r, size = Math.ceil(2 * r * base * dpr * 1.12) + 6;
      const c = mk(size, size); const x = c.getContext('2d'); x.translate(size / 2, size / 2);
      drawBladeShape(x, k, r * base * dpr);
      sprites[k] = { c, size, css: size / dpr };
    }
  }

  // ---- blade art (original designs; top-down, drawn in a local frame with radius R) ----------------
  function drawBladeShape(c, kind, R) {
    const col = COL[kind];
    const disc = (r, fill, stroke, lw) => { c.beginPath(); c.arc(0, 0, r, 0, TAU); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } };
    if (kind === 'striker') {
      disc(R * 0.62, '#12091f');
      for (let k = 0; k < 5; k++) {
        c.save(); c.rotate((k * TAU) / 5);
        c.beginPath(); c.moveTo(R * 0.28, -R * 0.2);
        c.quadraticCurveTo(R * 0.86, -R * 0.34, R * 1.0, R * 0.2);
        c.quadraticCurveTo(R * 0.7, R * 0.1, R * 0.34, R * 0.3); c.closePath();
        const g = c.createLinearGradient(R * 0.3, 0, R, 0); g.addColorStop(0, shade(col, -0.35)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, 0.55));
        c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = R * 0.03; c.stroke();
        c.restore();
      }
      disc(R * 0.52, null, shade(col, -0.2), R * 0.06);
      disc(R * 0.3, '#0c0616', col, R * 0.05); disc(R * 0.12, shade(col, 0.6));
    } else if (kind === 'aegis') {
      for (let k = 0; k < 6; k++) {
        c.save(); c.rotate((k * TAU) / 6);
        c.beginPath(); c.arc(0, 0, R, -TAU / 12 + 0.08, TAU / 12 - 0.08); c.arc(0, 0, R * 0.62, TAU / 12 - 0.1, -TAU / 12 + 0.1, true); c.closePath();
        const g = c.createLinearGradient(0, -R * 0.5, 0, R * 0.5); g.addColorStop(0, shade(col, 0.35)); g.addColorStop(1, shade(col, -0.35));
        c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = R * 0.03; c.stroke();
        c.restore();
      }
      for (let k = 0; k < 6; k++) { const an = (k * TAU) / 6 + TAU / 12; c.beginPath(); c.arc(Math.cos(an) * R * 0.83, Math.sin(an) * R * 0.83, R * 0.06, 0, TAU); c.fillStyle = '#10092a'; c.fill(); }
      disc(R * 0.6, '#150d34', shade(col, -0.1), R * 0.07);
      const g = c.createRadialGradient(-R * 0.1, -R * 0.1, 0, 0, 0, R * 0.4); g.addColorStop(0, shade(col, 0.7)); g.addColorStop(1, shade(col, -0.4));
      disc(R * 0.38, g); disc(R * 0.14, '#0b0620', shade(col, 0.4), R * 0.03);
    } else {
      c.strokeStyle = rgba(col, 0.55); c.lineWidth = R * 0.05;
      for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(0, 0, R * 0.94, (k * TAU) / 3 + 0.25, (k * TAU) / 3 + 1.55); c.stroke(); }
      for (let k = 0; k < 3; k++) {
        c.save(); c.rotate((k * TAU) / 3);
        c.beginPath(); c.moveTo(R * 0.2, R * 0.02);
        c.bezierCurveTo(R * 0.5, -R * 0.62, R * 1.0, -R * 0.42, R * 0.92, R * 0.12);
        c.bezierCurveTo(R * 0.8, -R * 0.14, R * 0.52, -R * 0.1, R * 0.3, R * 0.2); c.closePath();
        const g = c.createLinearGradient(R * 0.2, 0, R, 0); g.addColorStop(0, shade(col, -0.45)); g.addColorStop(0.6, col); g.addColorStop(1, shade(col, 0.6));
        c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = R * 0.025; c.stroke();
        c.restore();
      }
      disc(R * 0.3, '#0c1405', col, R * 0.05); disc(R * 0.11, shade(col, 0.6));
    }
  }

  // ==========================================================================================
  // FX — sparks, shock rings, shake, trails. All of it caps itself and degrades on slow devices.
  // ==========================================================================================
  const fx = {
    parts: [], rings: [], shakeMag: 0, sx: 0, sy: 0, level: 1,
    reset() { this.parts.length = 0; this.rings.length = 0; this.shakeMag = 0; },
    ring(x, y, s, color) {
      this.rings.push({ x, y, t: 0, max: G.reduced ? 0.35 : 0.3 + 0.14 * s, r0: G.reduced ? 12 + 14 * s : 5, r1: 14 + 24 * s, color });
      if (this.rings.length > 12) this.rings.shift();
    },
    spark(x, y, nx, ny, s, c1, c2) {
      if (G.reduced) return;
      const n = Math.round((7 + 24 * s) * this.level);
      for (let i = 0; i < n && this.parts.length < 190 * this.level; i++) {
        const side = Math.random() < 0.5 ? -1 : 1, spread = (Math.random() - 0.5) * 1.1;
        const ang = Math.atan2(ny, nx) + side * (Math.PI / 2 + spread);
        const sp = 50 + Math.random() * (110 + 120 * s);
        const life = 0.18 + Math.random() * 0.35;
        this.parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life, max: life, w: 0.7 + Math.random() * 0.9, c: Math.random() < 0.5 ? '#fff6c8' : (Math.random() < 0.5 ? c1 : c2) });
      }
    },
    shake(s) { if (!G.reduced) this.shakeMag = Math.max(this.shakeMag, 1.5 + 8 * s); },
    update(dt) {
      for (let i = this.parts.length - 1; i >= 0; i--) {
        const p = this.parts[i]; p.life -= dt;
        if (p.life <= 0) { this.parts[i] = this.parts[this.parts.length - 1]; this.parts.pop(); continue; }
        p.vx *= Math.exp(-3.2 * dt); p.vy *= Math.exp(-3.2 * dt); p.x += p.vx * dt; p.y += p.vy * dt;
      }
      for (let i = this.rings.length - 1; i >= 0; i--) { this.rings[i].t += dt; if (this.rings[i].t >= this.rings[i].max) this.rings.splice(i, 1); }
      this.shakeMag *= Math.exp(-16 * dt); if (this.shakeMag < 0.05) this.shakeMag = 0;
      this.sx = (Math.random() - 0.5) * 2 * this.shakeMag; this.sy = (Math.random() - 0.5) * 2 * this.shakeMag;
    },
  };

  // per-blade visual state (rotation speed, trail history)
  const vis = [{ rot: 0, omega: 8, trail: [] }, { rot: 0, omega: 8, trail: [] }];

  // ==========================================================================================
  // Input — pointer (slingshot to launch, virtual stick to steer) + keyboard
  // ==========================================================================================
  const input = {
    ptr: null, keys: new Set(), kbAim: { angle: -Math.PI / 2, power: 0.7, used: false },
    steer: { x: 0, y: 0 }, cancelHintAt: 0,
  };
  const MIN_PULL = 16;
  const maxPull = () => Math.max(110, view.scale * T.RIM * 0.5);
  const maxStick = () => 64;

  function aimNow() {
    const p = input.ptr;
    if (p && p.mode === 'aim') {
      const vx = p.ox - p.x, vy = p.oy - p.y, L = Math.hypot(vx, vy);
      if (L >= MIN_PULL) return { angle: Math.atan2(vy, vx), power: clamp((L - MIN_PULL) / (maxPull() - MIN_PULL), 0, 1), src: 'ptr' };
      return { angle: -Math.PI / 2, power: 0, src: 'ptr0' };
    }
    return { angle: input.kbAim.angle, power: input.kbAim.power, src: input.kbAim.used ? 'kb' : 'ghost' };
  }

  function readSteer() {
    let x = 0, y = 0;
    const p = input.ptr;
    if (p && p.mode === 'steer') {
      const dx = p.x - p.ox, dy = p.y - p.oy, L = Math.hypot(dx, dy);
      if (L > 6) { const m = Math.min(1, (L - 6) / (maxStick() - 6)); x += (dx / L) * m; y += (dy / L) * m; }
    }
    const k = input.keys;
    if (k.has('ArrowLeft') || k.has('KeyA')) x -= 1;
    if (k.has('ArrowRight') || k.has('KeyD')) x += 1;
    if (k.has('ArrowUp') || k.has('KeyW')) y -= 1;
    if (k.has('ArrowDown') || k.has('KeyS')) y += 1;
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    input.steer.x = x; input.steer.y = y;
  }

  el.canvas.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || input.ptr) return;
    Sfx.unlock();
    if (G.state !== 'ready' && G.state !== 'live') return;
    el.canvas.setPointerCapture(e.pointerId);
    input.ptr = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY, mode: G.state === 'ready' ? 'aim' : 'steer' };
    input.kbAim.used = false;
  });
  el.canvas.addEventListener('pointermove', (e) => { const p = input.ptr; if (p && p.id === e.pointerId) { p.x = e.clientX; p.y = e.clientY; } });
  const endPtr = (e) => {
    const p = input.ptr; if (!p || p.id !== e.pointerId) return;
    if (p.mode === 'aim' && e.type === 'pointerup' && G.state === 'ready') {
      const a = aimNow();
      if (a.src === 'ptr') launchNow(a.angle, a.power);
      else { input.cancelHintAt = G.t; setHint('Pull back further, then release', true); }
    }
    input.ptr = null;
  };
  el.canvas.addEventListener('pointerup', endPtr);
  el.canvas.addEventListener('pointercancel', endPtr);
  el.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'KeyM') { toggleMute(); return; }
    const inButton = e.target instanceof HTMLElement && e.target.closest('button');
    if (e.code === 'Escape') { if (G.state !== 'select') { e.preventDefault(); toSelect(true); } return; }
    if (G.state === 'ready') {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS'].includes(e.code)) { e.preventDefault(); input.kbAim.used = true; input.keys.add(e.code); }
      else if ((e.code === 'Space' || e.code === 'Enter') && !inButton) { e.preventDefault(); if (!e.repeat) { Sfx.unlock(); const a = input.kbAim; launchNow(a.angle, a.power); } }

    // body
    ctx.save(); ctx.rotate(v.rot); const s = spr.css / view.base;                // sprite is baked at the battle scale
    ctx.drawImage(spr.c, -s / 2, -s / 2, s, s); ctx.restore();
    if (lowF > 0) { ctx.fillStyle = `rgba(8,6,22,${0.38 * lowF})`; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill(); }
    // team ring (shape + colour, never colour alone: labels + HUD repeat it)
    const pulse = !b.out && b.spin < 22 && b.spin > 0 ? 0.55 + 0.45 * Math.sin(t * 14) : 1;
    ctx.strokeStyle = rgba(team, 0.95 * pulse); ctx.lineWidth = 1.7; ctx.beginPath(); ctx.arc(0, 0, R + 1.6, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawAim(m) {
    const b = m.blades[0], a = aimNow(), R = b.spec.r;
    const live = a.src !== 'ghost' && a.src !== 'ptr0';
    const p = live ? a.power : 0.62, ang = live ? a.angle : -Math.PI / 2;
    const k = live ? 1 : 0.28 + 0.12 * Math.sin(G.t * 3);
    const col = lerpColor(COL.you, '#ff5ccf', p);
    ctx.save(); ctx.translate(b.x, b.y); ctx.globalAlpha = k; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // power ring
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(0, 0, R + 6, 0, TAU); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(0, 0, R + 6, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(p, 0.02, 1)); ctx.stroke();
    // arrow
    const len = 24 + 56 * p, c = Math.cos(ang), s = Math.sin(ang);
    ctx.setLineDash([3.2, 3.2]); ctx.lineDashOffset = -G.t * 14; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(c * (R + 11), s * (R + 11)); ctx.lineTo(c * len, s * len); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.beginPath();
    ctx.moveTo(c * (len + 9), s * (len + 9)); ctx.lineTo(c * len - s * 5.5, s * len + c * 5.5); ctx.lineTo(c * len + s * 5.5, s * len - c * 5.5); ctx.closePath(); ctx.fill();
    ctx.restore();
    // ghost finger demonstrating the pull-back (first battles only)
    if (!live && !G.launchedEver && !G.reduced) {
      const ph = ((G.t - G.readySince) % 2.6) / 2.6, e = ph < 0.65 ? easeInOut(ph / 0.65) : 1, fade = ph < 0.8 ? 1 : 1 - (ph - 0.8) / 0.2;
      ctx.save(); ctx.translate(b.x, b.y + R + 14 + 34 * e); ctx.globalAlpha = 0.6 * fade;
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }
  const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  function lerpColor(a, b, t) { const A = rgb(a), B = rgb(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; }

  function drawKoMarks() {
    if (!G.ko.length) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (const k of G.ko) {
      const age = G.t - k.t;
      if (k.cause === 'ring') {
        const f = clamp(1 - age / 1.6, 0, 1); if (f <= 0) continue;
        const pulse = G.reduced ? 1 : 0.7 + 0.3 * Math.sin(age * 22);
        ctx.strokeStyle = rgba(COL.ring, 0.9 * f * pulse); ctx.lineWidth = 7;
        ctx.beginPath(); ctx.arc(0, 0, T.RIM + 1, k.angle - 0.28, k.angle + 0.28); ctx.stroke();
      } else {
        const b = G.match.blades[k.i], f = clamp(1 - age / 3, 0.35, 1);
        const r = b.spec.r * (1.55 + (G.reduced ? 0 : 0.18 * Math.sin(age * 8)));
        ctx.strokeStyle = rgba(COL.spin, 0.85 * f); ctx.lineWidth = 2.2; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    ctx.restore();
  }

  function drawFx() {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (const r of fx.rings) {
      const f = r.t / r.max, rad = lerp(r.r0, r.r1, 1 - Math.pow(1 - f, 2));
      ctx.strokeStyle = rgba(r.color, 0.7 * (1 - f)); ctx.lineWidth = 2.2 * (1 - f) + 0.4;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke();
    }
    for (const p of fx.parts) {
      const f = p.life / p.max; ctx.strokeStyle = p.c; ctx.globalAlpha = clamp(f * 1.4, 0, 1); ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
    }
    ctx.restore();
  }

  function drawLabels(m, alpha) {
    ctx.save(); ctx.font = '800 11px Orbitron, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const b of m.blades) {
      if (b.out || G.state === 'ending' || G.state === 'result') continue;
      const [x, y] = pos(b, alpha), dir = b.i === 0 ? 1 : -1;     // YOU below the blade, CPU above — never in the aim arrow's way
      const px = view.cx + fx.sx + x * view.scale, py = view.cy + fx.sy + y * view.scale + dir * ((b.spec.r + 6) * view.scale + 9);
      const text = b.i === 0 ? 'YOU' : 'CPU', col = b.i === 0 ? COL.you : COL.cpu, tw = ctx.measureText(text).width + 12;
      ctx.fillStyle = col; roundRect(px - tw / 2, py - 9, tw, 18, 5); ctx.fill();
      ctx.fillStyle = '#07051a'; ctx.fillText(text, px, py + 0.5);
    }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function drawStick() {
    const p = input.ptr; if (!p) return;
    ctx.save(); ctx.lineCap = 'round';
    const dx = p.x - p.ox, dy = p.y - p.oy, L = Math.hypot(dx, dy);
    const lim = p.mode === 'aim' ? maxPull() : maxStick(), k = L > lim ? lim / L : 1;
    const kx = p.ox + dx * k, ky = p.oy + dy * k;
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.ox, p.oy, 18, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.setLineDash([2, 5]); ctx.beginPath(); ctx.moveTo(p.ox, p.oy); ctx.lineTo(kx, ky); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = p.mode === 'aim' ? 'rgba(255,92,207,.55)' : 'rgba(25,227,255,.5)'; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(kx, ky, 14, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ==========================================================================================
  // Loop, adaptive quality, debug, lifecycle
  // ==========================================================================================
  let last = 0, accSlow = 0, accN = 0, dbgEl = null, dbgFps = 0, dbgAcc = 0, dbgN = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    const raw = (ts - last) / 1000; last = ts;
    const dt = Math.min(0.05, Math.max(0.0001, raw));
    metrics.frames++;
    if (G.state === 'live' || G.state === 'ready') {
      if (raw > 0.025) metrics.slowFrames++;
      if (raw * 1000 > metrics.worstFrameMs && metrics.frames > 30) metrics.worstFrameMs = Math.round(raw * 1000);
      accSlow += raw; accN++;
      if (accN >= 90) { if (accSlow / accN > 0.024 && fx.level > 0.5) { fx.level = 0.5; } accSlow = 0; accN = 0; }
    }
    frameUpdate(dt);
    render();
    if (DEBUG) {
      dbgAcc += raw; dbgN++;
      if (dbgAcc > 0.5) { dbgFps = dbgN / dbgAcc; dbgAcc = 0; dbgN = 0; dbgEl.textContent =
        `fps ${dbgFps.toFixed(0)}  slow ${metrics.slowFrames}  worst ${metrics.worstFrameMs}ms  fx ${fx.level}\n` +
        `battles ${metrics.battles}  rematch ${metrics.rematches}  change ${metrics.changes}  abandon ${metrics.abandons}\n` +
        `play-again ${metrics.results ? Math.round(100 * metrics.rematches / metrics.results) : 0}%  TTFL ${metrics.timeToFirstLaunchMs ?? '-'}ms  state ${G.state}`; }
    }
  }

  // wiring
  $('#btnStart').addEventListener('click', () => startBattle(false));
  $('#btnRematch').addEventListener('click', () => { metrics.rematches++; startBattle(true); });
  $('#btnChange').addEventListener('click', () => { metrics.changes++; Sfx.unlock(); Sfx.ui(); toSelect(false); });
  $('#btnBack').addEventListener('click', () => { Sfx.unlock(); Sfx.ui(); toSelect(true); });
  for (const b of document.querySelectorAll('.mute')) b.addEventListener('click', toggleMute);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Sfx.suspend(); last = 0; } else { Sfx.resume(); last = 0; } });
  let layoutQueued = false;
  const queueLayout = () => { if (layoutQueued) return; layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layout(); }); };
  if ('ResizeObserver' in window) new ResizeObserver(queueLayout).observe(el.stage);
  window.addEventListener('resize', queueLayout);
  window.addEventListener('orientationchange', queueLayout);

  // boot
  buildSelect();
  toggleMuteInit();
  function toggleMuteInit() {
    for (const b of document.querySelectorAll('.mute')) {
      b.setAttribute('aria-pressed', String(Sfx.muted)); b.setAttribute('aria-label', Sfx.muted ? 'Unmute sound effects' : 'Mute sound effects');
    }
  }
  el.youName.textContent = NAME(G.you); el.cpuName.textContent = 'CPU';
  if (DEBUG) {
    dbgEl = document.createElement('div'); dbgEl.id = 'debug'; document.body.appendChild(dbgEl);
    window.__spinblade = { G, SIM, metrics, fx, view };
  }
  layout();
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  fontsReady.then(queueLayout);
  requestAnimationFrame(frame);

  // offline after first load: cache the page with a tiny service worker (only over http/https)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
